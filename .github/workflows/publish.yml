name: publish

# Fires on a version tag. Uses PyPI Trusted Publishing, so no token is stored
# here. The publisher has to be registered on PyPI against this repository and
# this workflow filename before the first tag, or the upload is rejected.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Fail if the tag and the package version disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          test "$tag" = "$pkg" || {
            echo "tag $tag does not match package version $pkg"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
