name: plivo_sms-platform
label: SMS (Plivo)
kind: platform
version: 0.1.0
description: >
  Plivo SMS channel for Hermes Agent. Registers the "plivo_sms" platform
  adapter, a real-time two-way SMS gateway. Plivo posts inbound messages to a
  webhook hosted by the plugin, each sender gets its own agent session, and
  replies go out through the Plivo Messages API. At startup the plugin
  resolves a public URL and wires the Plivo application and phone number
  automatically. Markdown is stripped to plain text for SMS delivery.
author: Plivo
requires_env:
  - name: PLIVO_AUTH_ID
    description: "Plivo Auth ID (from https://cx.plivo.com/?utm_source=github&utm_medium=oss&utm_campaign=hermes-plivo-sms-gateway)"
    prompt: "Plivo Auth ID"
    url: "https://cx.plivo.com/?utm_source=github&utm_medium=oss&utm_campaign=hermes-plivo-sms-gateway"
    password: false
  - name: PLIVO_AUTH_TOKEN
    description: "Plivo Auth Token (also used to verify inbound MA-V3 webhook signatures)"
    prompt: "Plivo Auth Token"
    password: true
  - name: PLIVO_PHONE_NUMBER
    description: "Plivo phone number (SMS-capable, E.164 format) replies are sent from"
    prompt: "Plivo phone number"
    password: false
optional_env:
  - name: PLIVO_SMS_PUBLIC_URL
    description: "Public https base URL for the webhook server (else a quick tunnel is launched)"
    prompt: "Public base URL (e.g. https://example.com)"
    password: false
  - name: PLIVO_SMS_AUTO_WIRE
    description: "Set to false to skip the automatic Plivo application and number wiring"
    prompt: "Auto-wire Plivo (true/false)"
    password: false
  - name: PLIVO_SMS_ALLOWED_USERS
    description: "Comma-separated phone numbers allowed to talk to the agent"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: PLIVO_SMS_HOME_CHANNEL
    description: "Default phone number for cron / notification delivery"
    prompt: "Home number"
    password: false
